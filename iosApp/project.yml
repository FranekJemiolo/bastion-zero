name: BastionZero
options:
  bundleIdPrefix: com.bastionzero
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Bastion Zero
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [fetch, bluetooth-central, bluetooth-peripheral]
        BGTaskSchedulerPermittedIdentifiers: [com.bastionzero.ios.refresh]
        NSBluetoothAlwaysUsageDescription: "Bastion Zero uses Bluetooth Low Energy to create an offline ad-hoc survival mesh network."
        NSBluetoothPeripheralUsageDescription: "Bastion Zero advertises as a Bluetooth Low Energy node to relay survival data."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bastionzero.ios
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
