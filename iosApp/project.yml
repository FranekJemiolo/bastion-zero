name: BastionZero
options:
  bundleIdPrefix: com.bastionzero
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Bastion Zero
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.bastionzero.ios.refresh]
        # Phase 3 adds NSBluetoothAlwaysUsageDescription + bluetooth-central/peripheral modes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bastionzero.ios
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
